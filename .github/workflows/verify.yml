name: Verify macOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run package
      - name: Exercise packaged desktop
        run: npm run test:gui
        env:
          ADE_TEST_EXECUTABLE: ${{ github.workspace }}/dist/RLY ADE.app/Contents/MacOS/Electron
      - name: Preserve failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-failure
          path: logs/*-failure.png
          if-no-files-found: ignore
          retention-days: 3
      - run: npm test
